name: Deploy Invercrypto 2.0 Engine to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Deploy Strategy via SSH to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22

          script: |
            set -e

            echo "=================================================="
            echo "🚀 FIRING UP INVERCRYPTO LIVE DEPLOYMENT"
            echo "=================================================="

            TARGET_DIR="/home/ec2-user/invercrypto"
            IMAGE_NAME="invercrypto-engine"
            CONTAINER_NAME="invercrypto-live"

            echo ""
            echo "📂 Target directory:"
            echo "$TARGET_DIR"

            # ================================================================
            # 1. SYNCHRONIZE SOURCE CODE
            # ================================================================

            if [ ! -d "$TARGET_DIR/.git" ]; then

              echo ""
              echo "🔄 Repository not found. Initializing clean clone..."

              rm -rf /tmp/invercrypto_clone

              git clone \
                https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git \
                /tmp/invercrypto_clone

              mkdir -p "$TARGET_DIR"

              cp -r /tmp/invercrypto_clone/. "$TARGET_DIR/"

              rm -rf /tmp/invercrypto_clone

              cd "$TARGET_DIR"

              git config --global --add safe.directory "$TARGET_DIR"

            else

              cd "$TARGET_DIR"

              echo ""
              echo "🔄 Pulling latest quantitative engine updates..."

              git remote set-url origin \
                https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

              git fetch origin main

              git reset --hard origin/main

              git clean -fd

            fi

            # ================================================================
            # 2. VERIFY DEPLOYED COMMIT
            # ================================================================

            echo ""
            echo "=================================================="
            echo "📌 SOURCE CODE VERIFICATION"
            echo "=================================================="

            DEPLOYED_COMMIT=$(git rev-parse HEAD)

            echo "Commit: $DEPLOYED_COMMIT"

            git log -1 --oneline

            echo ""
            echo "Expected GitHub commit:"
            echo "${{ github.sha }}"

            if [ "$DEPLOYED_COMMIT" != "${{ github.sha }}" ]; then
              echo ""
              echo "❌ ERROR: EC2 repository does not match GitHub commit!"
              echo "Expected: ${{ github.sha }}"
              echo "Found:    $DEPLOYED_COMMIT"
              exit 1
            fi

            echo ""
            echo "✅ Source code matches GitHub Actions commit."

            # ================================================================
            # 3. ENVIRONMENT FILE GUARD
            # ================================================================

            echo ""
            echo "🔐 Checking environment configuration..."

            if [ ! -f ".env" ]; then
              echo "❌ ERROR: .env file not found."
              exit 1
            fi

            echo "✅ .env file found."

            # ================================================================
            # 4. PERSISTENT DATA DIRECTORY
            # ================================================================

            echo ""
            echo "📁 Ensuring persistent data directory exists..."

            mkdir -p "$TARGET_DIR/data"

            chmod -R 777 "$TARGET_DIR/data"

            echo "✅ Persistent data directory ready."

            # ================================================================
            # 5. BUILD DOCKER IMAGE
            # ================================================================

            echo ""
            echo "=================================================="
            echo "🐳 BUILDING DOCKER IMAGE"
            echo "=================================================="

            echo "Image: $IMAGE_NAME"
            echo "Dockerfile: strategy/Dockerfile"
            echo "Build context: $TARGET_DIR"

            docker build \
              --no-cache \
              -f strategy/Dockerfile \
              -t "$IMAGE_NAME:latest" \
              strategy

            echo ""
            echo "✅ Docker build completed successfully."

            # ================================================================
            # 6. VERIFY GENERATED IMAGE
            # ================================================================

            echo ""
            echo "=================================================="
            echo "🔍 DOCKER IMAGE VERIFICATION"
            echo "=================================================="

            IMAGE_ID=$(docker inspect "$IMAGE_NAME:latest" \
              --format '{{.Id}}')

            IMAGE_CREATED=$(docker inspect "$IMAGE_NAME:latest" \
              --format '{{.Created}}')

            echo "Image ID:      $IMAGE_ID"
            echo "Created:       $IMAGE_CREATED"

            echo ""
            echo "Docker image list:"

            docker images "$IMAGE_NAME"

            # ================================================================
            # 7. STOP OLD CONTAINER
            # ================================================================

            echo ""
            echo "=================================================="
            echo "🛑 CLEARING OLD CONTAINER"
            echo "=================================================="

            docker stop "$CONTAINER_NAME" || true
            docker rm "$CONTAINER_NAME" || true

            echo "✅ Old container removed."

            # ================================================================
            # 8. START NEW CONTAINER
            # ================================================================

            echo ""
            echo "=================================================="
            echo "🚀 STARTING NEW LIVE ENGINE"
            echo "=================================================="

            docker run -d \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              --log-driver=awslogs \
              --log-opt awslogs-region=sa-east-1 \
              --log-opt awslogs-group=/invercrypto/production-engine \
              --log-opt awslogs-stream=live-stream \
              --log-opt awslogs-create-group=true \
              --env-file .env \
              -v "$TARGET_DIR/data:/app/data" \
              "$IMAGE_NAME:latest"

            echo "✅ Container started."

            # ================================================================
            # 9. VERIFY RUNNING CONTAINER
            # ================================================================

            echo ""
            echo "=================================================="
            echo "🔎 RUNNING CONTAINER VERIFICATION"
            echo "=================================================="

            RUNNING_IMAGE=$(docker inspect "$CONTAINER_NAME" \
              --format '{{.Image}}')

            CONTAINER_CREATED=$(docker inspect "$CONTAINER_NAME" \
              --format '{{.Created}}')

            echo "Container:      $CONTAINER_NAME"
            echo "Container image: $RUNNING_IMAGE"
            echo "Container created: $CONTAINER_CREATED"

            echo ""
            echo "Expected image:"
            echo "$IMAGE_ID"

            if [ "$RUNNING_IMAGE" != "$IMAGE_ID" ]; then

              echo ""
              echo "❌ CRITICAL ERROR!"
              echo "Container is NOT running the image we just built."

              echo ""
              echo "Expected:"
              echo "$IMAGE_ID"

              echo ""
              echo "Running:"
              echo "$RUNNING_IMAGE"

              exit 1

            fi

            echo ""
            echo "✅ Container is running the newly built image."

            # ================================================================
            # 10. CONTAINER STATUS
            # ================================================================

            echo ""
            echo "=================================================="
            echo "📊 CONTAINER STATUS"
            echo "=================================================="

            docker ps \
              --filter "name=$CONTAINER_NAME" \
              --format "table {{.ID}}\t{{.Image}}\t{{.Status}}\t{{.Names}}"

            # ================================================================
            # 11. RECENT CONTAINER LOGS
            # ================================================================

            echo ""
            echo "=================================================="
            echo "📜 INITIAL ENGINE LOG"
            echo "=================================================="

            sleep 5

            docker logs --tail 30 "$CONTAINER_NAME" || true

            # ================================================================
            # 12. DISK CLEANUP
            # ================================================================

            echo ""
            echo "=================================================="
            echo "🧹 DOCKER DISK CLEANUP"
            echo "=================================================="

            docker builder prune -f

            docker image prune -f

            # ================================================================
            # 13. FINAL SYSTEM TELEMETRY
            # ================================================================

            echo ""
            echo "=================================================="
            echo "📊 FINAL SYSTEM TELEMETRY"
            echo "=================================================="

            docker system df

            echo ""
            echo "=================================================="
            echo "🦅 INVERCRYPTO LIVE ENGINE DEPLOYED SUCCESSFULLY"
            echo "=================================================="

            echo "Commit:"
            echo "$DEPLOYED_COMMIT"

            echo ""
            echo "Image:"
            echo "$IMAGE_ID"

            echo ""
            echo "Container:"
            echo "$CONTAINER_NAME"

            echo ""
            echo "Deployment completed successfully."